services:
  analysis-mongo:
    image: mongo:7
    container_name: pmub_analysis_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-analysis-data:/data/db

  analysis-api:
    build:
      context: ./backend
    container_name: pmub_analysis_api
    environment:
      APP_ENV: analysis-local
      APP_PRODUCT: analysis
      MONGO_URL: mongodb://analysis-mongo:27017
      DB_NAME: pmub_analysis_dev
      JWT_SECRET: dev-only-change-me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-now
      ADMIN_PASSCODE: dev-passcode-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: "180"
      CORS_ORIGINS: http://localhost:8081,http://192.168.50.131:8081,http://localhost:5179,http://192.168.50.131:5179
    ports:
      - "8003:8001"
    depends_on:
      - analysis-mongo
    volumes:
      - ./backend:/app
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

volumes:
  mongo-analysis-data:
